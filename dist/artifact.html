<title>Japansk verbquiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
:root {
  --bg: #ffffff;
  --text: #4b4b4b;
  --heading: #3c3c46;
  --muted: #afafaf;
  --card-bg: #ffffff;
  --card-border: #e5e5e5;
  --sel-bg: #ddf4ff;
  --sel-border: #84d8ff;
  --sel-text: #1899d6;
  --green: #58cc02;
  --green-dark: #4aa302;
  --green-text: #ffffff;
  --disabled-bg: #e5e5e5;
  --disabled-text: #afafaf;
  --good-bg: #d7ffb8;
  --good-text: #58a700;
  --bad-bg: #ffdfe0;
  --bad-text: #ea2b2b;
  --reveal-correct-bg: #d7ffb8;
  --reveal-correct-border: #a5ed6e;
  --reveal-wrong-bg: #ffdfe0;
  --reveal-wrong-border: #ff4b4b;
  --purple: #ce82ff;
  --track: #e5e5e5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131f24;
    --text: #f1f7fb;
    --heading: #f1f7fb;
    --muted: #7a8a92;
    --card-bg: #131f24;
    --card-border: #37464f;
    --sel-bg: #0e3a52;
    --sel-border: #3f85a7;
    --sel-text: #4cc2f1;
    --green: #58cc02;
    --green-dark: #3d8601;
    --green-text: #131f24;
    --disabled-bg: #37464f;
    --disabled-text: #52656d;
    --good-bg: #1c3b0e;
    --good-text: #93d333;
    --bad-bg: #3f2022;
    --bad-text: #ff7b7b;
    --reveal-correct-bg: #1c3b0e;
    --reveal-correct-border: #58a700;
    --reveal-wrong-bg: #3f2022;
    --reveal-wrong-border: #ff5b5b;
    --purple: #ce82ff;
    --track: #37464f;
  }
}
:root[data-theme="dark"] {
  --bg: #131f24;
  --text: #f1f7fb;
  --heading: #f1f7fb;
  --muted: #7a8a92;
  --card-bg: #131f24;
  --card-border: #37464f;
  --sel-bg: #0e3a52;

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-weight: 700;
}
.app {
  max-width: 520px;
  margin: 0 auto;
  padding: 20px 16px 150px;
}
.progress-track {
  height: 14px;
  border-radius: 7px;
  background: var(--track);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0;
  border-radius: 7px;
  background: var(--green);
  transition: width 0.3s ease;
  position: relative;
}
.progress-fill::after {
  content: "";
  position: absolute;
  left: 8px;
  right: 8px;
  top: 3px;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.3);
}
.progress-text {
  font-size: 0.8rem;
  color: var(--muted);
  margin-top: 6px;
  text-align: center;
  letter-spacing: 0.02em;
}
.heading {
  margin: 32px 0 8px;
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--purple);
  text-wrap: balance;
}
.heading .star {
  font-size: 1.3rem;
  margin-right: 4px;
}
.prompt {
  font-size: 2.5rem;
  line-height: 1.25;
  text-align: center;
  margin: 32px 0;
  color: var(--heading);
  font-weight: 700;
}
.prompt ruby rt {
  font-size: 0.9rem;
  color: var(--muted);
}
.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.option {
  min-height: 84px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: inherit;
  font-weight: 700;
  font-size: 1.05rem;
  color: var(--text);
  background: var(--card-bg);
  border: 2px solid var(--card-border);
  border-bottom-width: 4px;
  border-radius: 14px;
  cursor: pointer;
  transition: transform 0.05s ease;
}
.option:active:not(:disabled) {
  transform: translateY(2px);
  border-bottom-width: 2px;
  margin-bottom: 2px;
}
.option.selected {
  background: var(--sel-bg);
  border-color: var(--sel-border);
  color: var(--sel-text);
}
.option.reveal-correct {
  background: var(--reveal-correct-bg);
  border-color: var(--reveal-correct-border);
  color: var(--good-text);
}
.option.reveal-wrong {
  background: var(--reveal-wrong-bg);
  border-color: var(--reveal-wrong-border);
  color: var(--bad-text);
}
.option:disabled {
  cursor: default;
}
.footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  border-top: 2px solid var(--card-border);
  background: var(--bg);
}
.footer.good {
  background: var(--good-bg);
  border-top-color: var(--good-bg);
}
.footer.bad {
  background: var(--bad-bg);
  border-top-color: var(--bad-bg);
}
.footer-inner {
  max-width: 520px;
  margin: 0 auto;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
}
.feedback {
  margin-bottom: 12px;
}
.feedback-title {
  font-size: 1.3rem;
  font-weight: 900;
}
.feedback-text {
  margin-top: 2px;
  font-size: 1rem;
}
.footer.good .feedback-title,
.footer.good .feedback-text {
  color: var(--good-text);
}
.footer.bad .feedback-title,
.footer.bad .feedback-text {
  color: var(--bad-text);
}
#action {
  width: 100%;
  padding: 14px;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--green-text);
  background: var(--green);
  border: none;
  border-radius: 14px;
  box-shadow: 0 4px 0 var(--green-dark);
  cursor: pointer;
}
#action:active:not(:disabled) {
  transform: translateY(4px);
  box-shadow: none;
}
#action:disabled {
  background: var(--disabled-bg);
  color: var(--disabled-text);
  box-shadow: none;
  cursor: default;
}
@media (prefers-reduced-motion: reduce) {
  .progress-fill,
  .option {
    transition: none;
  }
}

<script>
const QuizLogic = (function () {
  const BOX_WEIGHTS = [16, 8, 4, 2, 1];
  const MAX_BOX = 4;
  const MASTERED_BOX = 3;

  function verbKey(verb) {
    return (verb.kanji || "") + "|" + verb.kana;
  }

  function updateBox(box, correct) {
    return correct ? Math.min(box + 1, MAX_BOX) : 0;
  }

  function pickNextVerb(verbs, boxes, lastKey, rng) {
    const candidates = verbs.filter(v => verbKey(v) !== lastKey);
    const pool = candidates.length > 0 ? candidates : verbs;
    const weights = pool.map(v => BOX_WEIGHTS[boxes[verbKey(v)] || 0]);
    let r = rng() * weights.reduce((a, b) => a + b, 0);
    for (let i = 0; i < pool.length; i++) {
      r -= weights[i];
      if (r < 0) return pool[i];
    }
    return pool[pool.length - 1];
  }

  function shuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildOptions(verbs, target, rng) {
    const others = verbs.filter(v => verbKey(v) !== verbKey(target));
    const distractors = shuffle(others, rng).slice(0, 3);
    return shuffle([target, ...distractors], rng);
  }

  function masteredCount(verbs, boxes) {
    return verbs.filter(v => (boxes[verbKey(v)] || 0) >= MASTERED_BOX).length;
  }

  return { verbKey, updateBox, pickNextVerb, shuffle, buildOptions, masteredCount, BOX_WEIGHTS, MAX_BOX, MASTERED_BOX };
})();
if (typeof module !== "undefined") module.exports = QuizLogic;
</script>
<script>
(function () {
  const STORAGE_KEY = "japansk-verbquiz-v1";

  function loadBoxes() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return data && typeof data === "object" ? data : {};
    } catch (e) {
      return {};
    }
  }

  function saveBoxes(boxes) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(boxes));
    } catch (e) { /* fortsett uten lagring */ }
  }

  const ROUND_LENGTH = 10;

  const boxes = loadBoxes();
  let lastKey = null;
  let current = null;
  let selected = null;
  let phase = "choose"; // "choose" | "feedback"
  let roundProgress = 0; // riktige svar denne runden, 0..ROUND_LENGTH

  const els = {
    progress: document.getElementById("progress"),
    progressBar: document.getElementById("progress-bar"),
    prompt: document.getElementById("prompt"),
    options: document.getElementById("options"),
    footer: document.getElementById("footer"),
    feedback: document.getElementById("feedback"),
    feedbackTitle: document.getElementById("feedback-title"),
    feedbackText: document.getElementById("feedback-text"),
    action: document.getElementById("action"),
  };

  function renderPrompt(verb) {
    els.prompt.textContent = "";
    if (verb.kanji) {
      const ruby = document.createElement("ruby");
      ruby.appendChild(document.createTextNode(verb.kanji));
      const rt = document.createElement("rt");
      rt.textContent = verb.kana;
      ruby.appendChild(rt);
      els.prompt.appendChild(ruby);
    } else {
      els.prompt.textContent = verb.kana;
    }
  }

  function renderProgress() {
    const learned = VERBS.filter(v => (boxes[QuizLogic.verbKey(v)] || 0) >= 1).length;
    els.progress.textContent = learned + " av " + VERBS.length;
    els.progressBar.style.width = (100 * roundProgress / ROUND_LENGTH) + "%";
  }

  function select(index) {
    if (phase !== "choose") return;
    selected = index;
    Array.from(els.options.children).forEach((btn, i) => {
      btn.classList.toggle("selected", i === index);
    });
    els.action.disabled = false;
  }

  function check() {
    if (selected === null) return;
    phase = "feedback";
    const key = QuizLogic.verbKey(current.verb);
    const correct = current.options[selected] === current.verb;
    boxes[key] = QuizLogic.updateBox(boxes[key] || 0, correct);
    saveBoxes(boxes);
    lastKey = key;
    Array.from(els.options.children).forEach((btn, i) => {
      btn.disabled = true;
      btn.classList.remove("selected");
      if (current.options[i] === current.verb) btn.classList.add("reveal-correct");
      else if (i === selected) btn.classList.add("reveal-wrong");
    });
    if (correct) roundProgress++;
    els.footer.classList.add(correct ? "good" : "bad");
    els.feedbackTitle.textContent = correct ? "Riktig!" : "Feil!";
    els.feedbackText.textContent = correct ? "" : "Riktig svar: " + current.verb.no;
    els.feedbackText.hidden = correct;
    els.feedback.hidden = false;
    els.action.textContent = "Fortsett";
    renderProgress();
  }

  function nextQuestion() {
    if (roundProgress >= ROUND_LENGTH) {
      roundProgress = 0;
      renderProgress();
    }
    const verb = QuizLogic.pickNextVerb(VERBS, boxes, lastKey, Math.random);
    current = { verb, options: QuizLogic.buildOptions(VERBS, verb, Math.random) };
    selected = null;
    phase = "choose";
    renderPrompt(verb);
    els.options.textContent = "";
    current.options.forEach((option, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option";
      btn.textContent = option.no;
      btn.addEventListener("click", () => select(i));
      els.options.appendChild(btn);
    });
    els.footer.classList.remove("good", "bad");
    els.feedback.hidden = true;
    els.action.textContent = "Sjekk";
    els.action.disabled = true;
  }

  els.action.addEventListener("click", () => {
    if (phase === "choose") check();
    else nextQuestion();
  });
  renderProgress();
  nextQuestion();
})();
</script>
