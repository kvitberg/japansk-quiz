}
@media (prefers-color-scheme: dark) {

    --disabled-text: #52656d;

    --good-text: #93d333;
    --bad-bg: #3f2022;
    --bad-text: #ff7b7b;
    --reveal-correct-bg: #1c3b0e;
    --reveal-correct-border: #58a700;
    --reveal-wrong-bg: #3f2022;
    --reveal-wrong-border: #ff5b5b;
    --purple: #ce82ff;
    --purple-soft: #2b1c3a;

  }
}
:root[data-theme="dark"] {
  --bg: #131f24;
  --text: #f1f7fb;
  --heading: #f1f7fb;

  --card-bg: #131f24;

  --sel-border: #3f85a7;
  --sel-text: #4cc2f1;
  --green: #58cc02;
  --green-dark: #3d8601;
  --green-text: #131f24;
  --disabled-bg: #37464f;
  --disabled-text: #52656d;
  --good-bg: #1c3b0e;
  --good-text: #93d333;
  --bad-bg: #3f2022;
  --bad-text: #ff7b7b;
  --reveal-correct-bg: #1c3b0e;
  --reveal-correct-border: #58a700;
  --reveal-wrong-bg: #3f2022;
  --reveal-wrong-border: #ff5b5b;
  --purple: #ce82ff;
  --purple-soft: #2b1c3a;
  --track: #37464f;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-weight: 700;
}
.app {
  max-width: 520px;
  margin: 0 auto;
  padding: 20px 16px 150px;
}
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.tab {
  flex: 1;
  padding: 10px 8px;
  font-family: inherit;
  font-weight: 800;
  font-size: 0.95rem;
  color: var(--muted);
  background: transparent;
  border: 2px solid var(--card-border);
  border-bottom-width: 4px;
  border-radius: 12px;
  cursor: pointer;
}
.tab[aria-selected="true"] {
  color: var(--purple);
  background: var(--purple-soft);
  border-color: var(--purple);
}
.tab:active {
  transform: translateY(2px);
  border-bottom-width: 2px;
  margin-bottom: 2px;
}
.progress-track {
  height: 14px;
  border-radius: 7px;
  background: var(--track);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0;
  border-radius: 7px;
  background: var(--green);
  transition: width 0.3s ease;
  position: relative;
}
.progress-fill::after {
  content: "";
  position: absolute;
  left: 8px;
  right: 8px;
  top: 3px;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.3);
}
.progress-text {
  font-size: 0.8rem;
  color: var(--muted);
  margin-top: 6px;
  text-align: center;
  letter-spacing: 0.02em;
}
.heading {
  margin: 32px 0 8px;
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--purple);
  text-wrap: balance;
}
.heading .star {
  font-size: 1.3rem;
  margin-right: 4px;
}
.prompt {
  font-size: 2.5rem;
  line-height: 1.25;
  text-align: center;
  margin: 32px 0;
  color: var(--heading);
  font-weight: 700;
}
.prompt ruby rt {
  font-size: 0.9rem;
  color: var(--muted);
}
.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.option {
  min-height: 84px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: inherit;
  font-weight: 700;
  font-size: 1.05rem;
  color: var(--text);
  background: var(--card-bg);
  border: 2px solid var(--card-border);
  border-bottom-width: 4px;
  border-radius: 14px;
  cursor: pointer;
  transition: transform 0.05s ease;
}
.option:active:not(:disabled) {
  transform: translateY(2px);
  border-bottom-width: 2px;
  margin-bottom: 2px;
}
.option.selected {
  background: var(--sel-bg);
  border-color: var(--sel-border);
  color: var(--sel-text);
}
.option.reveal-correct {
  background: var(--reveal-correct-bg);
  border-color: var(--reveal-correct-border);
  color: var(--good-text);
}
.option.reveal-wrong {
  background: var(--reveal-wrong-bg);
  border-color: var(--reveal-wrong-border);
  color: var(--bad-text);
}
.option:disabled {
  cursor: default;
}
.footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  border-top: 2px solid var(--card-border);
  background: var(--bg);
}
.footer.good {
  background: var(--good-bg);
  border-top-color: var(--good-bg);
}
.footer.bad {
  background: var(--bad-bg);
  border-top-color: var(--bad-bg);
}
.footer-inner {
  max-width: 520px;
  margin: 0 auto;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
}
.feedback {
  margin-bottom: 12px;
}
.feedback-title {
  font-size: 1.3rem;
  font-weight: 900;
}
.feedback-text {
  margin-top: 2px;
  font-size: 1rem;
}
.footer.good .feedback-title,
.footer.good .feedback-text {
  color: var(--good-text);
}
.footer.bad .feedback-title,
.footer.bad .feedback-text {
  color: var(--bad-text);
}
#action {
  width: 100%;
  padding: 14px;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--green-text);
  background: var(--green);
  border: none;
  border-radius: 14px;
  box-shadow: 0 4px 0 var(--green-dark);
  cursor: pointer;
}
#action:active:not(:disabled) {
  transform: translateY(4px);
  box-shadow: none;
}
#action:disabled {
  background: var(--disabled-bg);
  color: var(--disabled-text);
  box-shadow: none;
  cursor: default;
}
@media (prefers-reduced-motion: reduce) {
  .progress-fill,
  .option {
    transition: none;
  }
}
</style>
<main class="app">
  <header class="top">

    <div class="progress-track"><div id="progress-bar" class="progress-fill"></div></div>

  </header>
  <h1 class="heading"><span class="star">✦</span> Velg riktig betydning</h1>
  <div id="prompt" class="prompt" lang="ja"></div>
  <div id="options" class="options"></div>
</main>
<footer id="footer" class="footer">

    <div id="feedback" class="feedback" hidden>

      <div id="feedback-text" class="feedback-text"></div>
    </div>
    <button id="action" type="button" disabled>Sjekk</button>

</footer>

<script>
const QuizLogic = (function () {
  const BOX_WEIGHTS = [16, 8, 4, 2, 1];
  const MAX_BOX = 4;
  const MASTERED_BOX = 3;

  function verbKey(verb) {
    return (verb.kanji || "") + "|" + verb.kana;
  }

  function updateBox(box, correct) {
    return correct ? Math.min(box + 1, MAX_BOX) : 0;
  }

  function pickNextVerb(verbs, boxes, lastKey, rng) {
    const candidates = verbs.filter(v => verbKey(v) !== lastKey);
    const pool = candidates.length > 0 ? candidates : verbs;
    const weights = pool.map(v => BOX_WEIGHTS[boxes[verbKey(v)] || 0]);
    let r = rng() * weights.reduce((a, b) => a + b, 0);
    for (let i = 0; i < pool.length; i++) {
      r -= weights[i];
      if (r < 0) return pool[i];
    }
    return pool[pool.length - 1];
  }

  function shuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildOptions(verbs, target, rng) {
    const others = verbs.filter(v => verbKey(v) !== verbKey(target));
    const distractors = shuffle(others, rng).slice(0, 3);
    return shuffle([target, ...distractors], rng);
  }

  function masteredCount(verbs, boxes) {
    return verbs.filter(v => (boxes[verbKey(v)] || 0) >= MASTERED_BOX).length;
  }

  return { verbKey, updateBox, pickNextVerb, shuffle, buildOptions, masteredCount, BOX_WEIGHTS, MAX_BOX, MASTERED_BOX };
})();
if (typeof module !== "undefined") module.exports = QuizLogic;
</script>
<script>
(function () {
  const ROUND_LENGTH = 10;
  const MODE_KEY = "japansk-quiz-mode";

  const MODES = {
    verbs: { items: VERBS, storageKey: "japansk-verbquiz-v1" },
    words: { items: WORDS, storageKey: "japansk-gloser-v1" },
  };

  function read(key) {
    try {
      const data = JSON.parse(localStorage.getItem(key));
      return data && typeof data === "object" ? data : {};
    } catch (e) {
      return {};
    }
  }

  function write(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) { /* fortsett uten lagring */ }
  }

  function loadMode() {
    try {
      const saved = localStorage.getItem(MODE_KEY);
      return Object.prototype.hasOwnProperty.call(MODES, saved) ? saved : "verbs";
    } catch (e) {
      return "verbs";
    }
  }

  let mode = loadMode();
  let items = MODES[mode].items;
  let boxes = read(MODES[mode].storageKey);
  let lastKey = null;
  let current = null;
  let selected = null;
  let phase = "choose"; // "choose" | "feedback"
  let roundProgress = 0; // riktige svar denne runden, 0..ROUND_LENGTH

  const els = {
    tabs: { verbs: document.getElementById("tab-verbs"), words: document.getElementById("tab-words") },
    progress: document.getElementById("progress"),
    progressBar: document.getElementById("progress-bar"),
    prompt: document.getElementById("prompt"),
    options: document.getElementById("options"),
    footer: document.getElementById("footer"),
    feedback: document.getElementById("feedback"),
    feedbackTitle: document.getElementById("feedback-title"),
    feedbackText: document.getElementById("feedback-text"),
    action: document.getElementById("action"),
  };

  function renderTabs() {
    Object.keys(MODES).forEach(name => {
      els.tabs[name].setAttribute("aria-selected", String(name === mode));
    });
  }

  function renderPrompt(item) {
    els.prompt.textContent = "";
    if (item.kanji) {
      const ruby = document.createElement("ruby");
      ruby.appendChild(document.createTextNode(item.kanji));
      const rt = document.createElement("rt");
      rt.textContent = item.kana;
      ruby.appendChild(rt);
      els.prompt.appendChild(ruby);
    } else {
      els.prompt.textContent = item.kana;
    }
  }

  function renderProgress() {
    els.progress.textContent = roundProgress + " av " + ROUND_LENGTH;
    els.progressBar.style.width = (100 * roundProgress / ROUND_LENGTH) + "%";
  }

  function select(index) {
    if (phase !== "choose") return;
    selected = index;
    Array.from(els.options.children).forEach((btn, i) => {
      btn.classList.toggle("selected", i === index);
    });
    els.action.disabled = false;
  }

  function check() {
    if (selected === null) return;
    phase = "feedback";
    const key = QuizLogic.verbKey(current.item);
    const correct = current.options[selected] === current.item;
    boxes[key] = QuizLogic.updateBox(boxes[key] || 0, correct);
    write(MODES[mode].storageKey, boxes);
    lastKey = key;
    Array.from(els.options.children).forEach((btn, i) => {
      btn.disabled = true;
      btn.classList.remove("selected");
      if (current.options[i] === current.item) btn.classList.add("reveal-correct");
      else if (i === selected) btn.classList.add("reveal-wrong");
    });
    if (correct) roundProgress++;
    els.footer.classList.add(correct ? "good" : "bad");
    els.feedbackTitle.textContent = correct ? "Riktig!" : "Feil!";
    els.feedbackText.textContent = correct ? "" : "Riktig svar: " + current.item.no;
    els.feedbackText.hidden = correct;
    els.feedback.hidden = false;
    els.action.textContent = "Fortsett";
    renderProgress();
  }

  function nextQuestion() {
    if (roundProgress >= ROUND_LENGTH) {
      roundProgress = 0;
      renderProgress();
    }
    const item = QuizLogic.pickNextVerb(items, boxes, lastKey, Math.random);
    current = { item, options: QuizLogic.buildOptions(items, item, Math.random) };
    selected = null;
    phase = "choose";
    renderPrompt(item);
    els.options.textContent = "";
    current.options.forEach((option, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option";
      btn.textContent = option.no;
      btn.addEventListener("click", () => select(i));
      els.options.appendChild(btn);
    });
    els.footer.classList.remove("good", "bad");
    els.feedback.hidden = true;
    els.action.textContent = "Sjekk";
    els.action.disabled = true;
  }

  function switchMode(name) {
    if (name === mode) return;
    mode = name;
    items = MODES[mode].items;
    boxes = read(MODES[mode].storageKey);
    lastKey = null;
    roundProgress = 0;
    try {
      localStorage.setItem(MODE_KEY, mode);
    } catch (e) { /* fortsett uten lagring */ }
    renderTabs();
    renderProgress();
    nextQuestion();
  }

  Object.keys(MODES).forEach(name => {
    els.tabs[name].addEventListener("click", () => switchMode(name));
  });
  els.action.addEventListener("click", () => {
    if (phase === "choose") check();
    else nextQuestion();
  });

  renderTabs();
  renderProgress();
  nextQuestion();
})();
</script>
